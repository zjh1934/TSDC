apply plugin: 'com.android.application'

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.listenbook"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        // 全工程按 Java 7 写：显式泛型、匿名内部类、无 lambda、无 diamond
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// 零第三方依赖：AIDE 不支持远程 maven，androidx / jsoup / media3 / Compose 一律不能用
dependencies {
}
